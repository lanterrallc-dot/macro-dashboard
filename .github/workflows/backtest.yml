# Runs the Asset Outlook backtest and commits the result.
#
# This is deliberately NOT on the 15-minute schedule that refreshes the model:
# the backtest re-reads six years of history and re-derives the regime on
# hundreds of dates, and the answer barely moves week to week. Weekly, plus a
# manual button, is the right cadence.
#
# Save as .github/workflows/backtest.yml
name: Backtest asset outlook

on:
  workflow_dispatch:        # the "Run workflow" button in the Actions tab
  schedule:
    - cron: '0 7 * * 1'     # Mondays, 07:00 UTC

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 backtest_asset_outlook.py

      - name: Commit result
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add asset_outlook_backtest.json
          # Nothing to commit is a normal outcome, not a failure.
          git diff --staged --quiet || git commit -m "Backtest: refresh asset_outlook_backtest.json"
          git pushname: Backtest asset outlook
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: pip install pandas yfinance
      - name: Run backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 backtest_asset_outlook.py
      - name: Commit results
        run: |
          git config user.name macro-model-bot
          git config user.email actions@users.noreply.github.com
          git add asset_outlook_backtest.json
          git diff --quiet --cached || git commit -m automated-backtest
          git pull --rebase origin main
          git push
