name: Backtest asset outlook

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas yfinance

      - name: Run backtest
        run: python3 backtest_asset_outlook.py

      - name: Commit results
        - name: Commit updated output
        run: |
          git config user.name "macro-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add model_output.json
          git diff --quiet --cached || git commit -m "Refresh model output [skip ci]"
          git pull --rebase origin main
          git push