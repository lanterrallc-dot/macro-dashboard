name: Refresh BTC monitor

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-btc
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build btc_output.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CRYPTOQUANT_API_KEY: ${{ secrets.CRYPTOQUANT_API_KEY }}
          GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
        run: python refresh_btc.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc_output.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refresh BTC monitor data"
          # other refresh workflows commit to this repo too, so retry on a race
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
