name: Calibrate score sensitivity
on:
  workflow_dispatch: {}
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: pip install pandas numpy yfinance
      - name: Run calibration
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 calibrate_sensitivity.py
      - name: Commit results
        run: |
          git config user.name macro-model-bot
          git config user.email actions@users.noreply.github.com
          git add sensitivity_calibration.json
          git diff --quiet --cached || git commit -m calibration-results
          git pull --rebase origin main
          git push
