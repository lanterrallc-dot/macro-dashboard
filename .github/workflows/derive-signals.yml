name: Derive asset signals
on:
  workflow_dispatch: {}
jobs:
  derive-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: pip install pandas numpy yfinance
      - name: Run signal derivation
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 derive_asset_signals.py
      - name: Commit results
        run: |
          git config user.name macro-model-bot
          git config user.email actions@users.noreply.github.com
          git add asset_signals.json
          git diff --quiet --cached || git commit -m asset-signals
          git pull --rebase origin main
          git push